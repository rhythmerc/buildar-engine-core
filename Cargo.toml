[package]
name = "engine-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The contract between an AR runtime and the game engines it hosts: plain data, no Bevy. Core is mode-neutral; each mode (skate, ...) is a module."

[dependencies]
# Exactly the glam Bevy 0.18.1 resolves to, so a Bevy host passes Vec2/Vec3/Mat4 across unconverted.
glam = "=0.30.10"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
